[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-hitl"
version = "0.1.0"
description = "MCP human decisions via Telegram"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0", "fastapi==0.143.0", "httpx==0.28.1",
  "uvicorn==0.54.0", "pydantic==2.14.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
